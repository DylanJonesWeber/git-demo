<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Git Demo Task List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Git Demo Project</h1>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="Add a task" />
      <button type="submit">Add</button>
    </form>
    <div class="actions">
      <button id="show-all" type="button">Show All</button>
      <button id="show-open" type="button">Show Open</button>
      <button id="clear-completed" type="button">Clear Completed</button>
    </div>
    <ul id="task-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
